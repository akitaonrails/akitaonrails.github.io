<!doctype html>
<html lang="{{ site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 · {{ site.Title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: light dark; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fbf9f4; color: #1c211e; font-family: Inter, sans-serif; }
      main { width: min(100% - 2rem, 42rem); border-block: 1px solid #d6cfc2; padding: 2rem 0; }
      h1 { margin: 0; color: #1d4836; font: 600 clamp(3rem, 12vw, 6rem)/1 Newsreader, serif; }
      p { color: #525b54; }
      a { color: #1d4836; text-underline-offset: 3px; }
      @media (prefers-color-scheme: dark) { body { background: #121312; color: #f2efe9; } main { border-color: #41453f; } h1, a { color: #d8e9df; } p { color: #aaa69d; } }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>{{ T "pageNotFound" }}</p>
      <a href="{{ if eq site.Language.Lang "en" }}/en/{{ else }}/{{ end }}">{{ T "backToHome" }} →</a>
    </main>
  </body>
</html>
